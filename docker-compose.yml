services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: proctor, POSTGRES_PASSWORD: proctor, POSTGRES_DB: proctor }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  db_test:
    image: postgres:16
    environment: { POSTGRES_USER: proctor, POSTGRES_PASSWORD: proctor, POSTGRES_DB: proctor_test }
    ports: ["5433:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
